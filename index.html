<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mihi Creator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>Mihi Creator</h1>
        <p>Створюй красиві привітання для партнерів</p>
    </header>

    <main class="main">

        <section class="constructors">

            <article class="constructor-card">
                <h2>Сертифікат Mihi</h2>

                <p>
                    Вітання з новим рівнем!
                </p>

                <button id="certificate-button">
                    Створити сертифікат
                </button>
            </article>

            <article class="constructor-card">
                <h2>Запрошення в Mihi</h2>

                <p>
                    Вітання з реєстрацією!
                </p>

                <button id="invitation-button">
                    Створити запрошення
                </button>
            </article>

        </section>

        <section id="editor">
            <!-- Тут будуть редактори -->
        </section>

        <section id="certificate-result"></section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
